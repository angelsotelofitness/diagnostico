<style>
:root{--lime:#A8FF3E;--ink:#111111;--green:#1E4000;--soft:#F3F4EF;--mid:#62655C;--line:#E0E3D9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Poppins,"Segoe UI",system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100vh;font-size:16px;line-height:1.45}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.k{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
h1{font-size:34px;line-height:1.05;font-weight:800;margin:8px 0 14px}
h1 em{font-style:normal;background:var(--lime);color:var(--ink);padding:0 8px}
h2{font-size:24px;line-height:1.2;font-weight:800;margin:6px 0 12px}
p{margin:0 0 12px;color:#D9DCD2}
.logo{width:88px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px}
.stats div{border:1px solid #333;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:26px;color:var(--lime);line-height:1}
.stats span{font-size:11.5px;color:#D9DCD2}
.btn{display:block;width:100%;border:0;font:inherit;font-weight:800;font-size:17px;padding:16px;cursor:pointer;text-align:center;text-decoration:none}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ghost{background:transparent;color:#fff;border:2px solid #444}
.btn:active{transform:scale(.98)}
.small{font-size:12.5px;color:#8E9187;text-align:center;margin-top:12px}
.bar{height:6px;background:#2A2A2A;margin:6px 0 26px}
.bar i{display:block;height:100%;background:var(--lime);transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#8E9187}
.back{background:none;border:0;color:#8E9187;font:inherit;font-size:13px;cursor:pointer;padding:6px 0}
.tag{display:inline-block;background:#1E1E1E;color:var(--lime);font-size:11px;font-weight:700;padding:3px 9px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.q{font-size:22px;font-weight:700;line-height:1.3;margin:0 0 26px;color:#fff}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.yn .btn{font-size:20px;padding:20px}
.opts{display:grid;gap:10px}
.opts .btn{text-align:left;font-weight:600;font-size:16px}
.spacer{flex:1}
/* resultado */
.res{background:#fff;color:var(--ink);margin:0 -18px;padding:24px 18px 30px}
.res p{color:var(--ink)}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-size:64px;font-weight:800;line-height:1}
.score span{font-size:20px;font-weight:700;color:var(--mid)}
.lbl{display:inline-block;background:var(--lime);font-weight:800;padding:4px 10px;margin:8px 0 14px}
.pz{background:var(--ink);color:#fff;padding:16px;margin:16px 0}
.pz .k{margin-bottom:4px}
.pz h3{margin:0 0 6px;font-size:24px}
.pz p{color:#D9DCD2;margin:0 0 10px}
ul{margin:0;padding:0;list-style:none}
li{position:relative;padding:4px 0 4px 22px}
li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--lime)}
.cta{background:var(--lime);color:var(--ink);padding:18px;margin-top:18px}
.cta h3{margin:4px 0 6px;font-size:22px;line-height:1.15}
.cta .k{color:var(--green)}
.copy{background:#fff;border:2px dashed var(--green);padding:12px;font-weight:800;font-size:18px;text-align:center;margin:10px 0}
.cta .btn{margin-top:8px}
.btn-ink{background:var(--ink);color:#fff}
.mini{font-size:13px;color:var(--mid);text-align:center;margin-top:8px}
.prog{margin-top:22px}
.prog h3{font-size:18px;margin:0 0 8px}
.prog .row{border-bottom:1px solid var(--line);padding:9px 0}
.prog .row b{display:block}
.prog .row span{font-size:14px;color:var(--mid)}
.case{background:var(--soft);padding:14px;box-shadow:inset 6px 0 0 var(--lime);margin:16px 0;font-size:15px}
.case b{display:block}
.hide{display:none!important}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

  <h1>AUTODIAGNÓSTICO<br><em>EJECUTIVO</em></h1>
  <p>El test de 2 minutos que te dice por qué no has podido bajar de peso con tu agenda, y qué pieza arreglar primero.</p>

function pregunta(){
  const [t,p] = Q[st.i];
  app.innerHTML = `<div class="fade" style="display:flex;flex-direction:column;flex:1">
  <div class="top"><button class="back" onclick="go(st.i-1)">‹ Atrás</button><span>${st.i+1} de ${Q.length}</span></div>
  <div class="bar"><i style="width:${(st.i)/Q.length*100}%"></i></div>
  <span class="tag">${PIEZAS[p].n}</span>
  <div class="q">${esc(t)}</div>
  <div class="spacer"></div>
  <div class="yn"><button class="btn ${st.r[st.i]===1?'btn-lime':'btn-ghost'}" onclick="resp(1)">Sí</button><button class="btn ${st.r[st.i]===0?'btn-lime':'btn-ghost'}" onclick="resp(0)">No</button></div></div>`;
}

function profesion(){
  app.innerHTML = `<div class="fade" style="display:flex;flex-direction:column;flex:1">
  <div class="top"><button class="back" onclick="go(Q.length-1)">‹ Atrás</button><span>Último paso</span></div>
  <div class="bar"><i style="width:100%"></i></div>
  <div class="q">Para darte tu resultado: a qué te dedicas?</div>
  <div class="opts">${PROF.map((x,k)=>`<button class="btn btn-ghost" onclick="prof(${k})">${x}</button>`).join('')}</div></div>`;
}

function calc(){
  const pts = st.r.reduce((a,b)=>a+(b||0),0);
  const noPor = [0,0,0,0,0];
  Q.forEach(([,p],k)=>{ if(st.r[k]===0) noPor[p]++; });
  const max = Math.max(...noPor);
  const pieza = max>0 ? noPor.indexOf(max) : -1; // empate: la primera de la lista
  const rango = RANGOS.find(r=>pts<=r[0]);
  return {pts, pieza, rango};
}

function resultado(){
  const {pts,pieza,rango} = calc();
  const pz = pieza>=0 ? PIEZAS[pieza] : null;
  const texto = pz ? `Mi resultado: ${pts}/10 · ${pz.n}` : `Mi resultado: ${pts}/10 · sin pieza que frene`;

      <div class="row"><b>1. Diagnóstico Ejecutivo</b><span>Este test, pero completo y conmigo: tu agenda real, tus viajes, tu energía y tus 3 huecos fijos.</span></div>
      <div class="row"><b>2. Fuerza + running estratégico</b><span>Plan en 3 fases con cargas que suben cada semana y running hasta tus primeros 5 km. Máximo 4 horas a la semana.</span></div>
      <div class="row"><b>3. Protocolo de contingencia</b><span>4 versiones de cada sesión (gimnasio, casa, bandas, hotel) para que ningún día se pierda.</span></div>
      <div class="row" style="border:0"><b>4. Seguimiento y métricas</b><span>Check-in diario, plan de alimentación con IA, reporte de avance cada mes y acceso directo a mí por WhatsApp.</span></div>
    </div>
    <button class="btn btn-ghost" style="color:var(--mid);border-color:var(--line);margin-top:18px;font-size:14px" onclick="reiniciar()">Volver a hacer el test</button>
  </div></div>`;
  window.scrollTo(0,0);
}

function go(i){
  if(i<0){ st.i=-1; return intro(); }
  st.i=i;
  if(i>=Q.length) return profesion();
  pregunta();
}
function resp(v){ st.r[st.i]=v; setTimeout(()=>go(st.i+1),150); }
function prof(k){ st.prof=PROF[k]; st.i=Q.length+1; resultado(); }
function reiniciar(){ st.r=Array(Q.length).fill(null); st.prof=''; st.enviado=false; go(-1); }

function dm(){
  const t = document.getElementById('txt').textContent;
  const abrir = () => { location.href = 'https://ig.me/m/' + IG; };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(abrir, ()=>{ copiaVieja(t); abrir(); });
  } else { copiaVieja(t); abrir(); }
}
function copiaVieja(t){
  const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select(); try{document.execCommand('copy');}catch(e){} a.remove();
}

function guardar(pts, pieza){
  if(!SHEET_URL || st.enviado) return;
  st.enviado = true;
  const data = {puntaje:pts, pieza, profesion:st.prof, respuestas:st.r.map(x=>x===1?'S':'N').join(''), origen};
  try{ fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(data)}); }catch(e){}
}

intro();
</script>
